name: Curriculum Knowledge CI

on:
  pull_request:
    paths:
      - 'src/pages/KnowledgeMap.tsx'
      - 'src/pages/CurriculumReview.tsx'
      - 'src/pages/CurriculumStandards.tsx'
      - 'src/pages/StandardMappingReview.tsx'
      - 'src/pages/MathResearchSample.tsx'
      - 'src/components/curriculum/**'
      - 'src/content/curriculum/**'
      - 'config/curriculum-reviewers.json'
      - 'approvals/curriculum-standard-approvals.json'
      - 'scripts/curriculum-standard-gate.mjs'
      - 'scripts/sign-curriculum-standard-review.mjs'
      - 'src/App.tsx'
      - 'openspec/changes/curriculum-knowledge-map/**'
      - '.github/workflows/curriculum-knowledge-ci.yml'
  push:
    branches:
      - feat/curriculum-knowledge-v03
    paths:
      - 'src/pages/KnowledgeMap.tsx'
      - 'src/pages/CurriculumReview.tsx'
      - 'src/pages/CurriculumStandards.tsx'
      - 'src/pages/StandardMappingReview.tsx'
      - 'src/pages/MathResearchSample.tsx'
      - 'src/components/curriculum/**'
      - 'src/content/curriculum/**'
      - 'config/curriculum-reviewers.json'
      - 'approvals/curriculum-standard-approvals.json'
      - 'scripts/curriculum-standard-gate.mjs'
      - 'scripts/sign-curriculum-standard-review.mjs'
      - 'src/App.tsx'
      - 'openspec/changes/curriculum-knowledge-map/**'
      - '.github/workflows/curriculum-knowledge-ci.yml'

jobs:
  app-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --passWithNoTests
      - name: Verify Ed25519 gate implementation
        run: node scripts/curriculum-standard-gate.mjs --self-test
      - name: Confirm official standard mapping export is still blocked
        run: node scripts/curriculum-standard-gate.mjs --expect-blocked
